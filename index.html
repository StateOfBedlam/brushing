<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Brushing</title>
  <meta name="description" content="Personal tooth brushing and flossing tracker.">
  <meta name="theme-color" content="#f4f7f6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Brushing">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #14201d;
      --muted: #5f6e6a;
      --line: #dfe6e4;
      --accent: #12806c;
      --accent-soft: #dcf1ec;
      --accent-text: #ffffff;
      --miss: #b4412f;
      --miss-soft: #fbe6e2;
      --warn: #8a5a00;
      --warn-soft: #fdf1d6;
      --empty: #c7d1ce;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1413;
        --card: #19201e;
        --text: #e8efed;
        --muted: #93a39f;
        --line: #2a3431;
        --accent: #3cc3a7;
        --accent-soft: #173a33;
        --accent-text: #06201a;
        --miss: #f08a78;
        --miss-soft: #3d1f1a;
        --warn: #f1c46a;
        --warn-soft: #3a2e14;
        --empty: #3a4744;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px);
      -webkit-tap-highlight-color: transparent;
    }
    main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 8px 4px 0; }
    .card { background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--line); }
    button {
      font: inherit; color: inherit; border: 0; border-radius: 14px; cursor: pointer;
      min-height: 48px; padding: 0 16px; background: var(--accent-soft); font-weight: 600;
    }
    button.primary { background: var(--accent); color: var(--accent-text); }
    button.danger { background: var(--miss-soft); color: var(--miss); }
    button.ghost { background: transparent; border: 1px solid var(--line); }
    button.small { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
    button:active { transform: scale(.98); }

    /* Streak header */
    .streak { text-align: center; padding: 20px 16px; }
    .streak .num { font-size: 76px; font-weight: 700; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
    .streak .label { color: var(--muted); margin-top: 4px; }
    .streak .best { margin-top: 12px; font-size: 14px; color: var(--muted); }
    .streak.held .num { color: var(--muted); }
    .banner { background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-weight: 600; font-size: 15px; }

    /* Today */
    .today-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .today-title strong { font-size: 18px; }
    .today-title span { color: var(--muted); font-size: 14px; }
    .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .slot { min-height: 88px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 17px; }
    .slot .sub { font-size: 13px; font-weight: 500; opacity: .8; }
    .slot.done { background: var(--accent); color: var(--accent-text); }
    .floss-row { margin-top: 10px; display: flex; }
    .floss-row button { flex: 1; }

    /* Prompts */
    .prompt { display: flex; flex-direction: column; gap: 10px; }
    .prompt + .prompt { border-top: 1px solid var(--line); padding-top: 14px; margin-top: 14px; }
    .prompt .q { font-weight: 600; }
    .prompt .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* History */
    .list { padding: 4px 0; }
    .row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; min-height: 52px; width: 100%; background: none; border-radius: 0; font-weight: 400; text-align: left; }
    .row + .row { border-top: 1px solid var(--line); }
    .row .date { flex: 1; }
    .row .date small { display: block; color: var(--muted); font-size: 13px; }
    .marks { display: flex; gap: 6px; }
    .mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: transparent; border: 1.5px solid var(--empty); color: var(--muted); }
    .mark.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .tag { font-size: 12px; font-weight: 700; padding: 6px 8px; border-radius: 8px; }
    .tag.missed { background: var(--miss-soft); color: var(--miss); }
    .tag.unresolved { background: var(--warn-soft); color: var(--warn); }
    .empty { color: var(--muted); padding: 12px 16px; }
    .legend { color: var(--muted); font-size: 13px; margin: 0 4px; }
    .streak-row { display: flex; justify-content: space-between; padding: 12px 16px; }
    .streak-row + .streak-row { border-top: 1px solid var(--line); }
    .streak-row small { color: var(--muted); }

    footer { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .note { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }

    /* Sheets */
    dialog {
      border: 0; padding: 0; width: 100%; max-width: 520px; margin: auto auto 0; background: var(--card); color: var(--text);
      border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom);
    }
    dialog::backdrop { background: rgba(0,0,0,.4); }
    .sheet { padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
    .sheet h3 { margin: 0; font-size: 20px; }
    .field { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
    .field input[type=date] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 44px; }
    .field input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--accent); }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 4px; border-radius: 14px; }
    .seg label { display: grid; place-items: center; min-height: 44px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg label:has(input:checked) { background: var(--accent); color: var(--accent-text); }
    .sheet-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
    .entry { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; }
    .entry + .entry { border-top: 1px solid var(--line); }
    .entry small { display: block; color: var(--muted); font-size: 13px; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .error { background: var(--miss-soft); color: var(--miss); }
    .error pre { white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; font-size: 12px; color: var(--text); background: var(--card); padding: 8px; border-radius: 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main id="app">
    <p class="note">Loading…</p>
  </main>

  <dialog id="log-sheet"></dialog>
  <dialog id="day-sheet"></dialog>
  <dialog id="import-sheet"></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
